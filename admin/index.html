<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RedLion · Content editor</title>
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<style>
  #back-to-site{
    position:fixed;top:14px;right:16px;z-index:2147483647;
    padding:10px 18px;
    background:#5a0f12;color:#f2ede3;
    font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    text-decoration:none;border-radius:2px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    transition:background .2s ease;
  }
  #back-to-site:hover{background:#7a1a1e}
</style>
<!-- Netlify Identity widget (handles login/invitation flow) -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<!-- Decap CMS shell -->
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  // After Netlify Identity login, redirect into the CMS.
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) {
        window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
      }
    });
  }

  // Persistent "Back to site" button — Decap re-renders the DOM so we
  // re-inject if it disappears.
  function ensureBackButton() {
    if (document.getElementById('back-to-site')) return;
    const a = document.createElement('a');
    a.id = 'back-to-site';
    a.href = 'https://redlionpg.com/';
    a.textContent = '← Back to site';
    document.body.appendChild(a);
  }
  ensureBackButton();
  new MutationObserver(ensureBackButton).observe(document.body, { childList: true });
</script>
</body>
</html>
