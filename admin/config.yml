backend:
  name: git-gateway
  branch: main

# All editor uploads go into /assets so they sit alongside existing photos.
media_folder: assets
public_folder: /assets

# Show editorial workflow (draft → review → publish) so changes can be staged.
publish_mode: editorial_workflow

site_url: https://redlionversion1.netlify.app
display_url: https://redlionversion1.netlify.app
logo_url: /assets/logo-crest-transparent.png

collections:
  - name: contact
    label: Contact details
    files:
      - file: content/contact.json
        label: Office contact
        name: contact
        fields:
          - { label: 'Office address (multi-line)', name: address, widget: text }
          - { label: 'Email', name: email, widget: string }
          - { label: 'Phone (optional)', name: phone, widget: string, required: false }
          - { label: 'Availability', name: availability, widget: string, default: '24 hours, 7 days a week' }

  - name: services
    label: Services
    files:
      - file: content/services.json
        label: Services list
        name: services
        fields:
          - label: Services
            name: items
            widget: list
            fields:
              - { label: 'Number (e.g. 001)', name: num, widget: string }
              - { label: 'Title', name: title, widget: string }
              - { label: 'Italic accent in title', name: title_accent, widget: string, required: false }
              - { label: 'Description', name: description, widget: text }

  - name: divisions
    label: Departments
    files:
      - file: content/divisions.json
        label: Department cards
        name: divisions
        fields:
          - label: Departments
            name: items
            widget: list
            fields:
              - { label: 'Roman numeral (i, ii, iii, iv …)', name: roman, widget: string }
              - { label: 'Title', name: title, widget: string }
              - { label: 'Italic accent in title', name: title_accent, widget: string, required: false }
              - { label: 'Body', name: body, widget: text }
              - { label: 'Pull quote', name: quote, widget: text }
              - { label: 'Photo', name: image, widget: image }

  - name: team
    label: Team bios
    folder: content/team
    create: true
    slug: '{{order}}-{{slug}}'
    sortable_fields: [order, name]
    summary: '{{order}} · {{name}} {{name_em}}'
    fields:
      - { label: 'Order (1, 2, 3 …)', name: order, widget: number, value_type: int, min: 1 }
      - { label: 'First name', name: name, widget: string }
      - { label: 'Last name (italicised)', name: name_em, widget: string }
      - { label: 'Mark (e.g. Founder, Consultant)', name: mark, widget: string }
      - { label: 'Role', name: role, widget: string }
      - label: 'Credential chips'
        name: credentials
        widget: list
        field: { label: Chip, name: label, widget: string }
      - label: 'External link (optional)'
        name: link
        widget: object
        required: false
        fields:
          - { label: 'Label (e.g. "Survival Centric →")', name: label, widget: string }
          - { label: 'URL', name: url, widget: string }
      - { label: 'Bio (Markdown — write each paragraph on its own)', name: body, widget: markdown }

  - name: partners
    label: Partners
    files:
      - file: content/partners.json
        label: Partner list
        name: partners
        fields:
          - label: Partners
            name: items
            widget: list
            fields:
              - { label: 'Partner name (shown as logo text if no image)', name: name, widget: string }
              - { label: 'Tagline / sector (e.g. "Hospitality & private client")', name: tagline, widget: string, required: false }
              - { label: 'Italic accent in tagline', name: tagline_accent, widget: string, required: false }
              - { label: 'Website URL', name: url, widget: string, required: false }
              - { label: 'Logo image (optional — overrides text)', name: logo, widget: image, required: false }
